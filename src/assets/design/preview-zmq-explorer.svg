  <line x1="477" y1="174" x2="487" y2="184" stroke="#8E969E" stroke-width="3" stroke-linecap="round"/>
  <text x="512" y="178" font-family="Martian Mono, ui-monospace, monospace" font-size="28" fill="#E8E4DA">topic = telemetry</text>
