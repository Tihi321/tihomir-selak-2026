<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <title>Faux desktop app still of a message traffic explorer with a topic list and a table of messages</title>
  <rect width="1600" height="900" fill="#171B1F"/>
  <rect x="64" y="56" width="1472" height="788" rx="8" fill="#0F1215" stroke="#272D33" stroke-width="2"/>
